# Despliegue del simulador detrás de Nginx Proxy Manager (red root_default).
# El panel queda en http://aseti_trazabilidad:8080 dentro de la red; no se publican puertos al host.
services:
  trazabilidad:
    build: .
    container_name: aseti_trazabilidad
    restart: unless-stopped
    environment:
      - VELOCIDAD=10
      # - ASETI_TOKEN=...   clave de mantenimiento; si no se pone, se crea en datos/aseti-token.txt
    mem_limit: 256m
    volumes:
      - trazabilidad_datos:/app/datos   # ajustes del panel, clave de mantenimiento y auditoría
    networks:
      - root_default

volumes:
  trazabilidad_datos:

networks:
  root_default:
    external: true
