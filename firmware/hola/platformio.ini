; Paso 0 del firmware: confirmar que podemos programar las placas y que los pines son los correctos.
; Placa: Heltec WiFi LoRa 32 V2 (ESP32 + SX1276 a 915 MHz + OLED 0.96").
;
; Compilar y subir:   pio run -t upload
; Ver lo que escribe: pio device monitor

[env:heltec_v2]
platform = espressif32
board = heltec_wifi_lora_32_V2
framework = arduino
monitor_speed = 115200
lib_deps =
  sandeepmistry/LoRa@^0.8.0
  thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
