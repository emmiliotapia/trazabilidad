; Prueba de paridad: el ESP32 arma y lee tramas con la librería trama (C++)
; y comparar.py las compara con trama.js byte por byte.
;
;   pio run -t upload --upload-port COM7
;   python comparar.py COM7

[env:heltec_v2]
platform = espressif32
board = heltec_wifi_lora_32_V2
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib
